      type: object
      properties:
        message:
          type: string
    Meta:
      type: object
      x-ignore-model: true
    ServiceResponseGreeting:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Greeting'
        meta:
          $ref: '#/components/schemas/Meta'
      x-api-wrapper: true
      x-api-wrapper-type: io.github.blueprintplatform.openapi.generics.contract.envelope.ServiceResponse
      x-api-wrapper-datatype: Greeting
