name: Build & Test

on:
  push:
    branches: [ main ]
    # Public quickstart/docs have their own verification lane; build.yml still tests itself.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "quickstart/**"
      - "scripts/check-docs.rb"
      - "scripts/test-docs-checks.rb"
      - "scripts/verify-first-client.py"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/docs.yml"
      - ".github/workflows/jekyll-gh-pages.yml"
      - ".github/workflows/codeql.yml"

  pull_request:
    # Public quickstart/docs have their own verification lane; build.yml still tests itself.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "quickstart/**"
      - "scripts/check-docs.rb"
      - "scripts/test-docs-checks.rb"
      - "scripts/verify-first-client.py"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/docs.yml"
      - ".github/workflows/jekyll-gh-pages.yml"
      - ".github/workflows/codeql.yml"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Maven & application stacks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build and install core modules
        run: mvn -B -ntp clean install

      - name: Upload contract coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./openapi-generics-contract/target/site/jacoco/jacoco.xml
          flags: contract
          name: contract
          disable_search: true
          fail_ci_if_error: true
          verbose: true

      - name: Upload server starter coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./openapi-generics-server-starter/target/site/jacoco/jacoco.xml
          flags: server-starter
          name: server-starter
          disable_search: true
          fail_ci_if_error: true
          verbose: true

      - name: Upload Java codegen coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./openapi-generics-java-codegen/target/site/jacoco/jacoco.xml
          flags: java-codegen
          name: java-codegen
          disable_search: true
          fail_ci_if_error: true
          verbose: true

      - name: Set up JDK 25 for samples
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Build samples (end-to-end validation)
        run: mvn -B -ntp -f samples/pom.xml clean verify

      - name: Verify generated specs are committed
        run: git diff --exit-code -- samples

      - name: Build canonical Gradle stack
        working-directory: samples/gradle/customer-service
        run: |
          # Do not let pre-existing application classes mask first-build cache inputs.
          test ! -e consumer/build/classes/java/main
          test ! -e producer/build/classes/java/main
          ./gradlew clean build --no-build-cache --configuration-cache

      - name: Verify canonical Gradle stack configuration-cache reuse
        working-directory: samples/gradle/customer-service
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean build --no-build-cache --configuration-cache | tee "$RUNNER_TEMP/gradle-stack-cache-reuse.log"
          grep -Fq "Configuration cache entry reused." "$RUNNER_TEMP/gradle-stack-cache-reuse.log"

      - name: Verify Gradle stack snapshot is unchanged
        run: git diff --exit-code -- samples/gradle/customer-service/spec

  gradle-plugin:
    name: Gradle plugin
    runs-on: ubuntu-latest

    # E2E builds its own Maven codegen repository; no dependency on the Maven job.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      # Keep the Gradle 9.0.0 compatibility edge on JDK 21.
      - name: Verify Gradle plugin and report combined coverage
        working-directory: openapi-generics-gradle-plugin
        run: ./gradlew check e2eTest jacocoCombinedReport -PcombinedCoverage=true

      - name: Upload Gradle plugin combined coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./openapi-generics-gradle-plugin/build/reports/jacoco/jacocoCombinedReport/jacocoCombinedReport.xml
          flags: gradle-plugin
          name: gradle-plugin
          disable_search: true
          fail_ci_if_error: true
          verbose: true

  verify:
    # Preserve the existing required-check name and require both verification branches.
    name: Build & Verify
    runs-on: ubuntu-latest
    needs: [build, gradle-plugin]
    if: ${{ always() }}
    steps:
      - name: Require all verification jobs to succeed
        env:
          MAVEN_RESULT: ${{ needs.build.result }}
          GRADLE_RESULT: ${{ needs.gradle-plugin.result }}
        run: |
          test "$MAVEN_RESULT" = success
          test "$GRADLE_RESULT" = success
