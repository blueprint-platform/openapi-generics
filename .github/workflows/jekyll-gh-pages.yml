name: Pages

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - ".github/workflows/jekyll-gh-pages.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      BUNDLE_GEMFILE: ${{ github.workspace }}/docs/Gemfile
      JEKYLL_ENV: production
      JEKYLL_GITHUB_TOKEN: ${{ github.token }}
      PAGES_REPO_NWO: ${{ github.repository }}
      JEKYLL_BUILD_REVISION: ${{ github.sha }}
      PAGES_API_URL: ${{ github.api_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Use the same locked, patched Pages gems as the Documentation validation job.
      # actions/jekyll-build-pages@v1 carries its own github-pages 232 bundle.
      - name: Set up Ruby and locked Pages dependencies
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: docs

      - name: Build with locked Jekyll
        run: bundle exec jekyll build --source docs --destination _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
