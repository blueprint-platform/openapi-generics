<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title description">
<title id="title">Generated response structure versus shared Java binding</title>
<desc id="description">Verified excerpts from OpenAPI Generator 7.27.0 with the same response schema and RestClient options. Stock java generates a concrete wrapper containing PageCustomerDto and Meta. java-generics-contract generates ServiceResponsePageCustomerDto extending shared ServiceResponse of Page of CustomerDto. CustomerDto remains ordinarily generated in both runs; optional existing DTO reuse is not enabled.</desc>
<style>
text { font-family: Arial, Helvetica, sans-serif; fill: #18283f; }
.title { font-size: 32px; font-weight: 700; }
.heading { font-size: 23px; font-weight: 700; }
.body { font-size: 21px; }
.note { font-size: 19px; fill: #42556e; }
.code { white-space: pre; font-family: Menlo, Consolas, monospace; font-size: 20px; }
.accent { fill: #087568; }
</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#5a6c83" stroke-width="1.5"/></marker></defs>
<rect width="1280" height="620" fill="#f8fafc"/>
<text x="40" y="49" class="title">Same response schema. Preserve Java identity.</text>
<text x="40" y="83" class="note">OpenAPI Generator 7.27.0 · RestClient · same options · optional DTO reuse disabled</text>
<rect x="40" y="116" width="584" height="340" rx="12" fill="#ffffff" stroke="#cfdae6" stroke-width="1.5"/>
<rect x="656" y="116" width="584" height="340" rx="12" fill="#f0faf7" stroke="#78bcae" stroke-width="1.5"/>
<text x="64" y="155" class="heading">Stock Java generator</text>
<text x="680" y="155" class="heading">java-generics-contract</text>
<text x="64" y="187" class="note">Generated response fields</text>
<text x="680" y="187" class="note">Shared envelope + container binding</text>
<text x="64" y="238" class="code">public class</text>
<text x="64" y="270" class="code">  ServiceResponsePageCustomerDto {</text>
<text x="64" y="302" class="code">  private PageCustomerDto data;</text>
<text x="64" y="334" class="code">  private Meta meta;</text>
<text x="64" y="366" class="code">  // Accessors and annotations omitted</text>
<text x="64" y="398" class="code">}</text>
<text x="680" y="238" class="code">public class</text>
<text x="680" y="270" class="code">  ServiceResponsePageCustomerDto</text>
<text x="680" y="302" class="code">    extends ServiceResponse&lt;</text>
<text x="680" y="334" class="code">      Page&lt;CustomerDto&gt;&gt; {}</text>
<rect x="40" y="480" width="1200" height="102" rx="12" fill="#eaf0f7" stroke="#eaf0f7" stroke-width="1.5"/>
<text x="62" y="515" class="body">Shared authority: ServiceResponse&lt;T&gt; and Page&lt;T&gt; stay in the Java contract library.</text>
<text x="62" y="550" class="note">CustomerDto remains upstream-generated here. Ordinary API, DTO and transport generation stays upstream-owned.</text>
</svg>
