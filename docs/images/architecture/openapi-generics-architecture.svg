<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="940" viewBox="0 0 1280 940" role="img" aria-labelledby="title description">
<title id="title">OpenAPI Generics projection and reconstruction architecture</title>
<desc id="description">Java contract definitions are authoritative. Producer projection emits OpenAPI envelope, container and item identity. Shared Java reconstruction, orchestrated by Maven or Gradle, produces a generic transport binding. Applications use a stable client adapter instead of generated types. Bring Your Own Envelope selects the producer envelope. Bring Your Own Contract is optional client DTO reuse. Ordinary DTO, API and transport generation remains owned by upstream OpenAPI Generator.</desc>
<style>
text { font-family: Arial, Helvetica, sans-serif; fill: #18283f; }
.title { font-size: 32px; font-weight: 700; }
.heading { font-size: 23px; font-weight: 700; }
.body { font-size: 21px; }
.note { font-size: 19px; fill: #42556e; }
.code { white-space: pre; font-family: Menlo, Consolas, monospace; font-size: 20px; }
.accent { fill: #087568; }
</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#5a6c83" stroke-width="1.5"/></marker></defs>
<rect width="1280" height="940" fill="#f8fafc"/>
<text x="40" y="48" class="title">OpenAPI Generics: preserve the Java contract</text>
<text x="40" y="81" class="note">Projection and build flow — runtime HTTP calls are a separate application concern</text>
<rect x="40" y="108" width="1200" height="130" rx="12" fill="#eaf0f7" stroke="#b8cbe0" stroke-width="1.5"/>
<text x="62" y="145" class="heading">Java contracts are authoritative</text>
<text x="62" y="181" class="code">ServiceResponse&lt;Page&lt;CustomerDto&gt;&gt; — shared envelope and container, concrete payload</text>
<text x="62" y="215" class="note">BYOE (Bring Your Own Envelope): the producer can select its application-owned envelope.</text>
<path d="M200 238 L200 278" fill="none" stroke="#5a6c83" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="288" width="350" height="200" rx="12" fill="#ffffff" stroke="#cfdae6" stroke-width="1.5"/>
<rect x="452" y="288" width="370" height="200" rx="12" fill="#f1f6fc" stroke="#cfdae6" stroke-width="1.5"/>
<rect x="884" y="288" width="356" height="200" rx="12" fill="#ffffff" stroke="#cfdae6" stroke-width="1.5"/>
<text x="62" y="326" class="heading">1  Producer projection</text>
<text x="62" y="366" class="body">Spring MVC + server starter</text>
<text x="62" y="396" class="body">Discover supported contracts</text>
<text x="62" y="426" class="body">Publish concrete schemas</text>
<text x="62" y="456" class="body">with Java identity</text>
<text x="474" y="326" class="heading">2  OpenAPI protocol</text>
<text x="474" y="366" class="code">x-api-wrapper-type</text>
<text x="474" y="396" class="code">x-data-container-type</text>
<text x="474" y="426" class="code">x-data-item</text>
<text x="474" y="463" class="note">Envelope + container + item identity</text>
<text x="906" y="326" class="heading">3  Java reconstruction</text>
<text x="906" y="366" class="body">java-generics-contract</text>
<text x="906" y="396" class="body">Maven parent or Gradle plugin</text>
<text x="906" y="426" class="body">Same binding semantics</text>
<path d="M390 390 L442 390" fill="none" stroke="#5a6c83" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M822 390 L874 390" fill="none" stroke="#5a6c83" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1062 488 L1062 538" fill="none" stroke="#5a6c83" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="884" y="548" width="356" height="150" rx="12" fill="#f0faf7" stroke="#78bcae" stroke-width="1.5"/>
<rect x="452" y="548" width="370" height="150" rx="12" fill="#ffffff" stroke="#cfdae6" stroke-width="1.5"/>
<rect x="40" y="548" width="350" height="150" rx="12" fill="#ffffff" stroke="#cfdae6" stroke-width="1.5"/>
<text x="906" y="584" class="heading">Generated binding</text>
<text x="906" y="621" class="code">extends ServiceResponse&lt;</text>
<text x="906" y="650" class="code">  Page&lt;CustomerDto&gt;&gt;</text>
<text x="906" y="679" class="note">Concrete transport binding</text>
<text x="474" y="584" class="heading">Client library adapter</text>
<text x="474" y="624" class="body">Owns generated API/invoker</text>
<text x="474" y="653" class="body">Exposes stable interface</text>
<text x="474" y="682" class="body">and shared contract types</text>
<text x="62" y="584" class="heading">Application</text>
<text x="62" y="624" class="body">Controllers and services</text>
<text x="62" y="653" class="body">Use the stable client API</text>
<text x="62" y="682" class="body">Keep contract ownership</text>
<path d="M884 620 L832 620" fill="none" stroke="#5a6c83" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M452 620 L400 620" fill="none" stroke="#5a6c83" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="730" width="1200" height="90" rx="12" fill="#fff8e7" stroke="#ead69b" stroke-width="1.5"/>
<text x="62" y="766" class="body">Optional BYOC (Bring Your Own Contract): reuse existing DTOs in the generated client.</text>
<text x="62" y="799" class="note">This client-side mapping does not select the envelope. Unmapped DTOs remain ordinarily generated.</text>
<rect x="40" y="842" width="1200" height="66" rx="12" fill="#eaf0f7" stroke="#eaf0f7" stroke-width="1.5"/>
<text x="62" y="883" class="body">Upstream OpenAPI Generator owns ordinary DTO, API, authentication and HTTP transport generation.</text>
</svg>
