<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">OpenAPI Generics — preserve Java envelope and container identity</title>
  <desc id="description">Java generic contracts project through OpenAPI metadata into generated Java bindings extending shared types. Spring MVC projection and Maven or Gradle client generation. Choose your envelope; existing DTO reuse is optional. Ordinary API, DTO and transport generation stays with upstream OpenAPI Generator.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #18283f; }
    .name { font-size: 58px; font-weight: 700; letter-spacing: -1.4px; }
    .promise { font-size: 34px; font-weight: 700; }
    .context { font-size: 24px; fill: #42556e; }
    .label { font-size: 25px; font-weight: 700; }
    .code { font-family: Menlo, Consolas, monospace; font-size: 20px; white-space: pre; }
    .note { font-size: 21px; fill: #42556e; }
    .choice { font-size: 23px; fill: #087568; font-weight: 700; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#5a6c83" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1280" height="640" fill="#f8fafc"/>
  <g transform="translate(40 5)">
  <rect x="56" y="52" width="7" height="116" rx="3" fill="#087568"/>
  <text x="82" y="101" class="name">OpenAPI Generics</text>
  <text x="82" y="153" class="promise">Preserve Java envelope + container identity.</text>
  <text x="58" y="208" class="context">Spring MVC projection · Maven + Gradle client generation</text>

  <rect x="56" y="252" width="334" height="208" rx="14" fill="#fff" stroke="#cbd9e8" stroke-width="1.5"/>
  <text x="78" y="293" class="label">Java contract</text>
  <text x="78" y="346" class="code">ServiceResponse&lt;</text>
  <text x="78" y="379" class="code">  Page&lt;CustomerDto&gt;&gt;</text>
  <text x="78" y="431" class="note">Shared types own the contract</text>

  <path d="M399 356 H422" fill="none" stroke="#5a6c83" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="434" y="252" width="312" height="208" rx="14" fill="#eaf0f7" stroke="#cbd9e8" stroke-width="1.5"/>
  <text x="456" y="293" class="label">OpenAPI metadata</text>
  <text x="456" y="346" class="code">x-api-wrapper-type</text>
  <text x="456" y="379" class="code">x-data-container-type</text>
  <text x="456" y="412" class="code">x-data-item</text>

  <path d="M755 356 H778" fill="none" stroke="#5a6c83" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="790" y="252" width="354" height="208" rx="14" fill="#f0faf7" stroke="#78bcae" stroke-width="1.5"/>
  <text x="812" y="293" class="label">Generated binding</text>
  <text x="812" y="346" class="code">extends ServiceResponse&lt;</text>
  <text x="812" y="379" class="code">  Page&lt;CustomerDto&gt;&gt;</text>
  <text x="812" y="431" class="note">Concrete transport subclass</text>

  <text x="58" y="514" class="choice">Choose your envelope. Existing DTO reuse is optional.</text>
  <line x1="56" y1="541" x2="1144" y2="541" stroke="#d5dfeb"/>
  <text x="58" y="579" class="note">Ordinary API, DTO and transport generation: upstream OpenAPI Generator.</text>
  </g>
</svg>
